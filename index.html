<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>The Million Dollar Wall</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f3f6fa;
  color: #202b3b;
  font-family: Arial, Helvetica, sans-serif;
}

header {
  background: #ffffff;
  border-bottom: 1px solid #e2e8f0;
  text-align: center;
  padding: 25px 15px;
}

h1 {
  font-size: 32px;
  margin: 0;
}

h1 span {
  color: #159c64;
}

header p {
  color: #64748b;
  margin-bottom: 0;
}

main {
  max-width: 1500px;
  margin: auto;
  padding: 20px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 365px;
  gap: 20px;
  align-items: start;
}

.panel {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 20px;
  min-width: 0;
}

h2 {
  margin: 0 0 12px;
}

.muted {
  color: #64748b;
  font-size: 13px;
  line-height: 1.6;
}

button {
  background: #24354d;
  color: white;
  border: none;
  border-radius: 9px;
  padding: 12px 14px;
  font-weight: bold;
  cursor: pointer;
}

button:hover:not(:disabled) {
  filter: brightness(1.12);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.secondary {
  background: #e8edf3;
  color: #24354d;
}

.primary {
  background: #159c64;
  width: 100%;
  font-size: 15px;
  padding: 16px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
  align-items: center;
}

#stage {
  width: 100%;
  max-height: 75vh;
  overflow: auto;
  background: #edf2f7;
  padding: 12px;
  border-radius: 10px;
}

#wall {
  position: relative;
  width: 600px;
  height: 600px;
  background: white;
  border: 3px solid #dc5757;
  cursor: crosshair;
  touch-action: none;
  overflow: hidden;
}

#wall canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}

#base {
  image-rendering: pixelated;
}

#grid,
#overlay {
  pointer-events: none;
}

.priceBox {
  background: #eefaf3;
  padding: 18px;
  border-radius: 12px;
  margin: 18px 0;
}

.priceBox strong {
  display: block;
  font-size: 36px;
  color: #159c64;
  margin: 7px 0;
}

.step {
  margin-top: 24px;
  margin-bottom: 13px;
  font-size: 15px;
  font-weight: bold;
  display: flex;
  gap: 10px;
  align-items: center;
}

.stepNumber {
  background: #dff5e8;
  color: #128452;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
}

.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.option {
  display: block;
  border: 2px solid #e2e8f0;
  border-radius: 11px;
  padding: 13px;
  cursor: pointer;
  font-size: 14px;
}

.option:has(input:checked) {
  border-color: #159
