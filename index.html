
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>The Million Dollar Wall</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f6fa;
  color: #1d2939;
}

header {
  background: white;
  text-align: center;
  padding: 24px 15px;
  border-bottom: 1px solid #e2e8f0;
}

h1 { margin: 0; font-size: 32px; }
h1 span { color: #159664; }

header p { color: #64748b; }

main {
  max-width: 1450px;
  margin: auto;
  padding: 18px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 18px;
  align-items: start;
}

.panel {
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 20px;
  min-width: 0;
}

h2 { margin-top: 0; }

.muted, small {
  color: #64748b;
  font-size: 13px;
  line-height: 1.5;
}

button {
  border: 0;
  background: #26364b;
  color: white;
  border-radius: 9px;
  padding: 12px 14px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.secondary {
  background: #e9eef4;
  color: #26364b;
}

.primary {
  background: #159664;
  width: 100%;
  padding: 15px;
  font-size: 15px;
}

.buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
}

.buttons button { flex: 1; }

#stage {
  width: 100%;
  display: flex;
  overflow: auto;
  background: #edf2f7;
  padding: 12px;
  border-radius: 10px;
  max-height: 75vh;
}

#wall {
  position: relative;
  width: 600px;
  height: 600px;
  flex: 0 0 auto;
  border: 3px solid #e45c58;
  background: white;
  cursor: crosshair;
  touch-action: none;
  overflow: hidden;
}

#wall canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#base { image-rendering: pixelated; }
#grid, #overlay { pointer-events: none; }
